<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>ACMI Santander</title>

  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Montserrat:wght@600;700;800;900&display=swap" rel="stylesheet">

  <style>
    :root{
      --azul-acmi:#143f7d;
      --azul-acmi-2:#0f3569;
      --azul-profundo:#08284f;
      --verde-acmi:#2a9c52;
      --verde-claro:#7ed49a;
      --gris-fondo:#f4f7fb;
      --gris-suave:#eef3f8;
      --texto:#243244;
      --texto-suave:#5b6d82;
      --blanco:#ffffff;
      --sombra-suave:0 10px 26px rgba(8,40,79,0.08);
      --sombra-media:0 18px 44px rgba(8,40,79,0.12);
      --sombra-fuerte:0 28px 70px rgba(8,40,79,0.18);
      --radio:22px;
      --radio-grande:34px;
      --ancho:1440px;
      --ancho-lectura:1120px;
      --transicion:all 0.28s ease;
    }

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
    }

    html{
      scroll-behavior:smooth;
    }

    body{
      font-family:'Inter', sans-serif;
      background:
        radial-gradient(circle at top left, rgba(42,156,82,0.08), transparent 28%),
        radial-gradient(circle at top right, rgba(20,63,125,0.10), transparent 30%),
        var(--gris-fondo);
      color:var(--texto);
      line-height:1.7;
      overflow-x:hidden;
    }

    img{
      max-width:100%;
      display:block;
    }

    a{
      text-decoration:none;
    }

    section{
      scroll-margin-top:120px;
    }

    .container{
      width:100%;
      max-width:var(--ancho);
      margin:0 auto;
      padding:0 56px;
    }

    .reveal{
      opacity:0;
      transform:translateY(24px);
      transition:opacity 0.75s ease, transform 0.75s ease;
    }

    .reveal.is-visible{
      opacity:1;
      transform:translateY(0);
    }

    @media(prefers-reduced-motion:reduce){
      *,
      *::before,
      *::after{
        animation:none !important;
        transition:none !important;
        scroll-behavior:auto !important;
      }

      .reveal{
        opacity:1;
        transform:none;
      }
    }

    /* ==============================
       TOPBAR
       ============================== */

    .topbar{
      background:linear-gradient(90deg, var(--azul-profundo), var(--azul-acmi-2));
      color:#dfe8f5;
      font-size:14px;
      padding:10px 0;
      position:relative;
      z-index:1200;
    }

    .topbar-content{
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:18px;
      flex-wrap:wrap;
    }

    .topbar-left,
    .topbar-right{
      display:flex;
      gap:20px;
      align-items:center;
      flex-wrap:wrap;
    }

    .topbar a{
      color:#dfe8f5;
      font-weight:700;
      transition:var(--transicion);
    }

    .topbar a:hover{
      color:white;
      transform:translateY(-1px);
    }

    /* ==============================
       HEADER
       ============================== */

    header{
      background:rgba(255,255,255,0.88);
      backdrop-filter:blur(16px);
      -webkit-backdrop-filter:blur(16px);
      box-shadow:0 8px 24px rgba(8,40,79,0.08);
      border-bottom:1px solid rgba(20,63,125,0.08);
      position:sticky;
      top:0;
      z-index:1100;
    }

    .main-header{
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:24px;
      min-height:98px;
      padding:14px 0;
    }

    .brand{
      display:flex;
      align-items:center;
      gap:16px;
      min-width:260px;
    }

    .brand-logo{
      width:74px;
      height:74px;
      border-radius:50%;
      background:white;
      border:1px solid #d7e2ef;
      padding:6px;
      object-fit:contain;
      box-shadow:0 10px 26px rgba(8,40,79,0.12);
      transition:var(--transicion);
    }

    .brand:hover .brand-logo{
      transform:scale(1.04) rotate(-2deg);
    }

    .brand-text h1{
      font-family:'Montserrat', sans-serif;
      font-size:29px;
      line-height:1.05;
      color:var(--azul-acmi);
      margin-bottom:4px;
      letter-spacing:-0.04em;
      font-weight:900;
    }

    .brand-text p{
      font-size:14px;
      color:#50627a;
      font-weight:500;
      line-height:1.35;
    }

  nav ul{
  list-style:none;
  display:flex;
  gap:6px;
  align-items:center;
  flex-wrap:nowrap;
  justify-content:flex-end;
}

    nav li{
      position:relative;
    }

    nav a{
      display:inline-flex;
      align-items:center;
      padding:10px 12px;
      border-radius:999px;
      font-family:'Inter', sans-serif;
      font-size:14.5px;
      font-weight:800;
      color:var(--azul-acmi);
      transition:var(--transicion);
      white-space:nowrap;
    }

    nav a:hover{
      color:var(--verde-acmi);
      background:#eef7f1;
      transform:translateY(-1px);
    }

    header,
    nav,
    nav ul,
    nav li{
      overflow:visible;
    }

    .dropdown-menu{
      display:none;
      position:absolute;
      top:100%;
      left:0;
      right:auto;
      background:white;
      min-width:285px;
      box-shadow:0 18px 44px rgba(8,40,79,0.16);
      border-radius:18px;
      padding:10px;
      z-index:9999;
      border:1px solid rgba(20,63,125,0.08);
      animation:menuFade 0.22s ease;
    }

    @keyframes menuFade{
      from{
        opacity:0;
        transform:translateY(8px);
      }
      to{
        opacity:1;
        transform:translateY(0);
      }
    }

    .dropdown:hover > .dropdown-menu{
      display:block;
    }

    .dropdown-menu > a,
    .dropdown-menu .submenu > a{
      display:block;
      padding:12px 16px;
      color:var(--azul-acmi);
      white-space:nowrap;
      font-size:14px;
      font-weight:800;
      border-radius:12px;
    }

    .dropdown-menu > a:hover,
    .dropdown-menu .submenu > a:hover{
      background:#eef3f8;
      color:var(--verde-acmi);
    }

    .submenu{
      position:relative;
    }

    .submenu-menu{
      display:none;
      position:absolute;
      top:0;
      left:100%;
      right:auto;
      background:white;
      min-width:280px;
      box-shadow:0 18px 44px rgba(8,40,79,0.16);
      border-radius:18px;
      padding:10px;
      z-index:10000;
      border:1px solid rgba(20,63,125,0.08);
      animation:menuFade 0.22s ease;
    }

    .submenu:hover > .submenu-menu{
      display:block;
    }

    .submenu-menu a{
      display:block;
      padding:12px 16px;
      color:var(--azul-acmi);
      white-space:nowrap;
      font-size:14px;
      font-weight:800;
      border-radius:12px;
    }

    .submenu-menu a:hover{
      background:#eef3f8;
      color:var(--verde-acmi);
    }

    /* ==============================
       HERO
       ============================== */

    .hero{
      position:relative;
      background:
        linear-gradient(135deg, rgba(8,40,79,0.86), rgba(20,63,125,0.72), rgba(42,156,82,0.48)),
        url("/chicamocha.jpg") center/cover no-repeat;
      min-height:68vh;
      display:flex;
      align-items:center;
      justify-content:center;
      text-align:center;
      color:white;
      overflow:hidden;
      isolation:isolate;
    }

    .hero::before{
      content:"";
      position:absolute;
      width:520px;
      height:520px;
      border-radius:50%;
      background:radial-gradient(circle, rgba(255,255,255,0.16), transparent 62%);
      top:-160px;
      right:-120px;
      animation:floatGlow 8s ease-in-out infinite alternate;
      z-index:-1;
    }

    .hero::after{
      content:"";
      position:absolute;
      width:420px;
      height:420px;
      border-radius:50%;
      background:radial-gradient(circle, rgba(126,212,154,0.26), transparent 62%);
      bottom:-180px;
      left:-120px;
      animation:floatGlow 9s ease-in-out infinite alternate-reverse;
      z-index:-1;
    }

    @keyframes floatGlow{
      from{
        transform:translate3d(0,0,0) scale(1);
      }
      to{
        transform:translate3d(28px,18px,0) scale(1.06);
      }
    }

    .hero-content{
      position:relative;
      z-index:1;
      width:min(1080px, 92%);
      padding:90px 0;
      animation:heroIntro 0.95s ease both;
    }

    @keyframes heroIntro{
      from{
        opacity:0;
        transform:translateY(28px);
      }
      to{
        opacity:1;
        transform:translateY(0);
      }
    }

    .hero-badge{
      display:inline-block;
      padding:11px 20px;
      border-radius:999px;
      background:rgba(255,255,255,0.16);
      border:1px solid rgba(255,255,255,0.32);
      font-weight:800;
      font-size:14px;
      margin-bottom:22px;
      box-shadow:0 16px 36px rgba(0,0,0,0.12);
      backdrop-filter:blur(8px);
    }

    .hero h2{
      font-family:'Montserrat', sans-serif;
      font-size:clamp(42px, 5vw, 74px);
      line-height:1.02;
      margin-bottom:22px;
      font-weight:900;
      letter-spacing:-0.065em;
      text-wrap:balance;
    }

    .hero p{
      font-size:clamp(18px, 2vw, 24px);
      max-width:980px;
      margin:0 auto 34px;
      color:#f2f7ff;
      font-weight:500;
    }

    .hero-actions,
    .eventos-actions{
      display:flex;
      justify-content:center;
      gap:14px;
      flex-wrap:wrap;
    }

    /* ==============================
       BOTONES
       ============================== */

    .btn{
      display:inline-flex;
      align-items:center;
      justify-content:center;
      gap:8px;
      padding:13px 22px;
      border-radius:14px;
      font-weight:900;
      transition:var(--transicion);
      box-shadow:0 10px 22px rgba(8,40,79,0.10);
    }

    .btn-primary{
      background:linear-gradient(135deg, var(--verde-acmi), #35b862);
      color:white;
    }

    .btn-primary:hover{
      transform:translateY(-3px);
      box-shadow:0 18px 34px rgba(42,156,82,0.26);
      filter:saturate(1.08);
    }

    .btn-light{
      background:white;
      color:var(--azul-acmi);
    }

    .btn-light:hover{
      transform:translateY(-3px);
      background:#eef4fb;
      box-shadow:0 18px 34px rgba(8,40,79,0.18);
    }

    /* ==============================
       SECCIONES GENERALES
       ============================== */

    .section{
      padding:96px 0;
    }

    .section-title{
      text-align:center;
      margin-bottom:18px;
      font-family:'Montserrat', sans-serif;
      font-size:clamp(34px, 4vw, 52px);
      color:var(--azul-acmi);
      font-weight:900;
      letter-spacing:-0.055em;
      line-height:1.05;
    }

    .section-subtitle{
      text-align:center;
      max-width:980px;
      margin:0 auto 44px;
      color:var(--texto-suave);
      font-size:19px;
      line-height:1.75;
      font-weight:500;
    }

    .card{
      background:rgba(255,255,255,0.92);
      border-radius:var(--radio-grande);
      box-shadow:var(--sombra-media);
      padding:38px;
      border:1px solid rgba(20,63,125,0.08);
      backdrop-filter:blur(8px);
    }

    /* ==============================
       QUIÉNES SOMOS
       ============================== */

    .about-block{
      max-width:var(--ancho-lectura);
      margin:0 auto;
    }

    .about-block h3{
      font-family:'Montserrat', sans-serif;
      color:var(--azul-acmi);
      margin:26px 0 12px;
      font-size:26px;
      font-weight:900;
      letter-spacing:-0.035em;
    }

    .about-block p{
      color:#425268;
      font-size:17px;
      font-weight:500;
    }

    .cards-grid{
      display:grid;
      grid-template-columns:repeat(4, 1fr);
      gap:22px;
      max-width:var(--ancho-lectura);
      margin:34px auto 0 auto;
    }

    .mini-card,
    .evento-item{
      background:#fff;
      border-radius:22px;
      box-shadow:var(--sombra-suave);
      padding:28px;
      text-align:center;
      border:1px solid rgba(20,63,125,0.08);
      border-top:5px solid var(--verde-acmi);
      transition:var(--transicion);
      position:relative;
      overflow:hidden;
    }

    .mini-card::before,
    .evento-item::before{
      content:"";
      position:absolute;
      inset:auto -40px -70px auto;
      width:140px;
      height:140px;
      border-radius:50%;
      background:rgba(42,156,82,0.08);
      transition:var(--transicion);
    }

    .mini-card:hover,
    .evento-item:hover{
      transform:translateY(-7px);
      box-shadow:var(--sombra-media);
    }

    .mini-card:hover::before,
    .evento-item:hover::before{
      transform:scale(1.18);
      background:rgba(20,63,125,0.08);
    }

    .mini-card h4,
    .evento-item h4{
      font-family:'Montserrat', sans-serif;
      color:var(--azul-acmi);
      margin-bottom:9px;
      font-size:20px;
      font-weight:900;
      letter-spacing:-0.03em;
      position:relative;
      z-index:2;
    }

    .mini-card p,
    .evento-item p{
      position:relative;
      z-index:2;
      color:#52667d;
      font-weight:500;
    }

    /* ==============================
       ORGANIGRAMA
       ============================== */

    #organigrama{
      background:
        radial-gradient(circle at top right, rgba(20,63,125,0.08), transparent 30%),
        #f5f7fb;
    }

    .org-grid{
      display:grid;
      grid-template-columns:repeat(3, 1fr);
      gap:26px;
      max-width:1280px;
      margin:0 auto;
      align-items:stretch;
    }

    .org-card{
      background:rgba(255,255,255,0.96);
      border-radius:26px;
      box-shadow:var(--sombra-suave);
      padding:34px 26px;
      border:1px solid rgba(20,63,125,0.08);
      border-top:6px solid var(--azul-acmi);
      text-align:center;
      transition:var(--transicion);
      position:relative;
      overflow:hidden;
    }

    .org-card::after{
      content:"";
      position:absolute;
      width:170px;
      height:170px;
      border-radius:50%;
      background:linear-gradient(135deg, rgba(20,63,125,0.08), rgba(42,156,82,0.08));
      bottom:-90px;
      right:-70px;
      transition:var(--transicion);
    }

    .org-card:hover{
      transform:translateY(-8px);
      box-shadow:var(--sombra-media);
      border-top-color:var(--verde-acmi);
    }

    .org-card:hover::after{
      transform:scale(1.25);
    }

    .org-card h3{
      font-family:'Montserrat', sans-serif;
      color:var(--azul-acmi);
      margin-bottom:16px;
      font-size:23px;
      line-height:1.2;
      font-weight:900;
      letter-spacing:-0.04em;
      position:relative;
      z-index:2;
    }

    .org-card p{
      margin:7px 0;
      color:#2d3d52;
      font-size:16px;
      line-height:1.5;
      text-align:center;
      font-weight:600;
      position:relative;
      z-index:2;
    }

    /* ==============================
       EVENTOS
       ============================== */

    #eventos{
      background:
        radial-gradient(circle at top left, rgba(42,156,82,0.10), transparent 34%),
        radial-gradient(circle at top right, rgba(20,63,125,0.12), transparent 32%),
        #f5f7fb;
    }

    .eventos-title{
      font-size:clamp(38px, 4.8vw, 60px);
      letter-spacing:-0.06em;
      margin-bottom:14px;
      position:relative;
    }

    .eventos-title::after{
      content:"";
      display:block;
      width:132px;
      height:6px;
      border-radius:999px;
      margin:20px auto 0 auto;
      background:linear-gradient(90deg, var(--verde-acmi), var(--azul-acmi));
      box-shadow:0 8px 18px rgba(20,63,125,0.18);
    }

    .eventos-subtitle{
      max-width:980px;
      font-size:19px;
      line-height:1.75;
      margin-bottom:54px;
    }

    .evento-card-grande{
      max-width:1280px;
      margin:0 auto 58px auto;
      border-radius:34px;
      overflow:hidden;
      position:relative;
      box-shadow:var(--sombra-fuerte);
      border:1px solid rgba(20,63,125,0.10);
      transition:var(--transicion);
    }

    .evento-card-grande:hover{
      transform:translateY(-4px);
      box-shadow:0 34px 80px rgba(8,40,79,0.20);
    }

    .evento-card-grande::before{
      content:"";
      position:absolute;
      inset:0 0 auto 0;
      height:8px;
      z-index:3;
      background:linear-gradient(90deg, var(--verde-acmi), var(--azul-acmi));
    }

    .evento-card-proximos{
      background:
        linear-gradient(180deg, rgba(255,255,255,0.96), rgba(248,251,255,0.98));
    }

    .evento-card-repositorio{
      background:
        linear-gradient(135deg, rgba(8,40,79,0.98), rgba(20,63,125,0.94), rgba(42,156,82,0.58)),
        url("/chicamocha.jpg") center/cover no-repeat;
      color:white;
    }

    .evento-card-repositorio::after{
      content:"";
      position:absolute;
      inset:0;
      background:
        radial-gradient(circle at top left, rgba(42,156,82,0.25), transparent 34%),
        radial-gradient(circle at bottom right, rgba(255,255,255,0.12), transparent 30%);
      pointer-events:none;
    }

    .evento-card-repositorio > *{
      position:relative;
      z-index:2;
    }

    .evento-card-header{
      text-align:center;
      max-width:940px;
      margin:0 auto;
      padding:50px 38px 28px 38px;
    }

    .evento-card-header h3{
      font-family:'Montserrat', sans-serif;
      color:var(--azul-acmi);
      font-size:clamp(32px, 3.4vw, 48px);
      line-height:1.08;
      font-weight:900;
      letter-spacing:-0.055em;
      margin-bottom:12px;
    }

    .evento-card-header h3::after{
      content:"";
      display:block;
      width:100px;
      height:5px;
      border-radius:999px;
      margin:18px auto 0 auto;
      background:linear-gradient(90deg, var(--verde-acmi), var(--azul-acmi));
    }

    .evento-card-header p{
      color:#5b6d82;
      font-size:18px;
      line-height:1.75;
      max-width:800px;
      margin:20px auto 0 auto;
      font-weight:500;
    }

    .evento-card-header-repositorio h3,
    .evento-card-header-repositorio p{
      color:white;
    }

    .evento-card-header-repositorio h3::after{
      background:linear-gradient(90deg, var(--verde-claro), #ffffff);
    }

    .bloque-etiqueta{
      display:inline-block;
      padding:10px 18px;
      border-radius:999px;
      background:#eaf4ee;
      color:var(--verde-acmi);
      border:1px solid rgba(42,156,82,0.22);
      font-size:13px;
      font-weight:900;
      text-transform:uppercase;
      letter-spacing:0.08em;
      margin-bottom:18px;
      box-shadow:0 8px 18px rgba(42,156,82,0.10);
    }

    .bloque-etiqueta-azul{
      background:rgba(255,255,255,0.16);
      color:white;
      border:1px solid rgba(255,255,255,0.30);
      box-shadow:0 8px 18px rgba(20,63,125,0.10);
      backdrop-filter:blur(8px);
    }

    .evento-card-contenido{
      padding:22px 52px 52px 52px;
    }

    .evento-card-contenido-proximos{
      display:grid;
      grid-template-columns:1.2fr 0.8fr;
      gap:34px;
      align-items:center;
    }

    .evento-card-contenido-repositorio{
      display:grid;
      grid-template-columns:1.1fr 0.9fr;
      gap:34px;
      align-items:center;
    }

    .proximo-evento-info{
      text-align:left;
    }

    .evento-label,
    .repositorio-home-badge{
      display:inline-block;
      padding:10px 16px;
      border-radius:999px;
      font-weight:900;
      font-size:13px;
      text-transform:uppercase;
      letter-spacing:0.07em;
      margin-bottom:18px;
    }

    .evento-label-proximo{
      background:#eaf4ee;
      color:var(--verde-acmi);
      border:1px solid rgba(42,156,82,0.22);
    }

    .repositorio-home-badge{
      background:rgba(255,255,255,0.16);
      border:1px solid rgba(255,255,255,0.30);
      color:white;
      backdrop-filter:blur(8px);
    }

    .proximo-evento-info h3{
      font-family:'Montserrat', sans-serif;
      color:var(--azul-acmi);
      font-size:clamp(30px, 3vw, 42px);
      line-height:1.12;
      font-weight:900;
      letter-spacing:-0.05em;
      margin-bottom:15px;
    }

    .proximo-evento-info p{
      color:#52667d;
      font-size:18px;
      line-height:1.75;
      margin-bottom:24px;
      font-weight:500;
    }

    .proximo-evento-decoracion{
      min-height:340px;
      border-radius:28px;
      background:
        linear-gradient(135deg, rgba(20,63,125,0.90), rgba(42,156,82,0.70)),
        url("/chicamocha.jpg") center/cover no-repeat;
      display:flex;
      align-items:center;
      justify-content:center;
      position:relative;
      overflow:hidden;
      box-shadow:inset 0 0 0 1px rgba(255,255,255,0.18);
    }

    .proximo-evento-decoracion::after{
      content:"";
      position:absolute;
      inset:0;
      background:radial-gradient(circle at center, rgba(255,255,255,0.14), transparent 60%);
    }

    .decoracion-circulo{
      width:190px;
      height:190px;
      border-radius:50%;
      background:rgba(255,255,255,0.16);
      border:1px solid rgba(255,255,255,0.38);
      display:flex;
      align-items:center;
      justify-content:center;
      color:white;
      font-family:'Montserrat', sans-serif;
      font-size:42px;
      font-weight:900;
      box-shadow:0 18px 36px rgba(0,0,0,0.20);
      position:relative;
      z-index:2;
      backdrop-filter:blur(6px);
      animation:pulseCircle 3.2s ease-in-out infinite;
    }

    @keyframes pulseCircle{
      0%,100%{
        transform:scale(1);
      }
      50%{
        transform:scale(1.045);
      }
    }

    .repositorio-home-texto h3{
      font-family:'Montserrat', sans-serif;
      font-size:clamp(30px, 3.1vw, 44px);
      line-height:1.12;
      margin-bottom:15px;
      color:white;
      letter-spacing:-0.05em;
      font-weight:900;
    }

    .repositorio-home-texto p{
      color:#edf5ff;
      font-size:18px;
      line-height:1.75;
      max-width:700px;
      margin-bottom:24px;
      font-weight:500;
    }

    .eventos-badges{
      display:flex;
      flex-direction:column;
      gap:10px;
      margin-bottom:26px;
    }

    .badge{
      width:fit-content;
      font-size:15px;
      line-height:1.4;
      color:inherit;
      padding:8px 12px;
      border-radius:999px;
      background:rgba(20,63,125,0.06);
      font-weight:700;
    }

    .evento-card-repositorio .badge{
      background:rgba(255,255,255,0.14);
      border:1px solid rgba(255,255,255,0.16);
      color:white;
      backdrop-filter:blur(8px);
    }

    .repositorio-home-actions{
      display:flex;
      gap:14px;
      flex-wrap:wrap;
    }

    .repositorio-home-actions .btn{
      border-radius:14px;
    }

    .repositorio-home-actions .btn-light{
      color:var(--azul-acmi);
    }

    .repositorio-mini-grid{
      display:grid;
      grid-template-columns:repeat(2, 1fr);
      gap:18px;
    }

    .repositorio-mini-card{
      background:rgba(255,255,255,0.96);
      color:var(--azul-acmi);
      border-radius:22px;
      padding:22px;
      box-shadow:0 12px 26px rgba(0,0,0,0.14);
      transition:var(--transicion);
      text-align:left;
      border:1px solid rgba(20,63,125,0.08);
      position:relative;
      overflow:hidden;
    }

    .repositorio-mini-card::after{
      content:"";
      position:absolute;
      inset:auto -35px -55px auto;
      width:110px;
      height:110px;
      border-radius:50%;
      background:rgba(42,156,82,0.09);
      transition:var(--transicion);
    }

    .repositorio-mini-card:hover{
      transform:translateY(-7px);
      background:white;
      box-shadow:0 18px 36px rgba(0,0,0,0.18);
    }

    .repositorio-mini-card:hover::after{
      transform:scale(1.2);
      background:rgba(20,63,125,0.08);
    }

    .repositorio-mini-card span{
      display:block;
      font-size:32px;
      margin-bottom:8px;
      position:relative;
      z-index:2;
    }

    .repositorio-mini-card strong{
      display:block;
      font-family:'Montserrat', sans-serif;
      font-size:18px;
      margin-bottom:6px;
      font-weight:900;
      letter-spacing:-0.03em;
      position:relative;
      z-index:2;
    }

    .repositorio-mini-card small{
      color:#52667d;
      font-size:13px;
      line-height:1.55;
      font-weight:600;
      position:relative;
      z-index:2;
    }

<script>
  let certificados = [];

  function quitarTildes(texto){
    return texto.normalize("NFD").replace(/[\u0300-\u036f]/g, "");
  }

  function normalizarNombre(valor){
    return quitarTildes(valor)
      .trim()
      .replace(/\s+/g, " ")
      .toUpperCase();
  }

  function normalizarEmail(valor){
    return valor
      .trim()
      .toLowerCase()
      .replace(/\s+/g, "");
  }

  function normalizarCelular(valor){
    let texto = valor.replace(/\D/g, "");

    if(texto.startsWith("57") && texto.length > 10){
      texto = texto.slice(-10);
    }

    return texto;
  }

  async function sha256(texto){
    const encoder = new TextEncoder();
    const data = encoder.encode(texto.trim().toLowerCase());
    const hashBuffer = await crypto.subtle.digest("SHA-256", data);
    const hashArray = Array.from(new Uint8Array(hashBuffer));

    return hashArray
      .map(b => b.toString(16).padStart(2, "0"))
      .join("");
  }

  async function cargarJson(ruta, tipoCertificado){
    const respuesta = await fetch(ruta + "?v=" + Date.now());

    if(!respuesta.ok){
      throw new Error("No se encontró " + ruta);
    }

    const datos = await respuesta.json();

    if(!Array.isArray(datos)){
      throw new Error("El archivo " + ruta + " no tiene formato válido.");
    }

    return datos.map(item => ({
      ...item,
      tipo_certificado: tipoCertificado
    }));
  }

  async function cargarCertificados(){
    certificados = [];

    const bases = [
      {
        ruta: "/repositorio-eventos/certificados/certificados.json",
        tipo: "Asistente"
      },
      {
        ruta: "/repositorio-eventos/certificados/certificados_ponentes.json",
        tipo: "Ponente"
      }
    ];

    const resultados = await Promise.allSettled(
      bases.map(base => cargarJson(base.ruta, base.tipo))
    );

    resultados.forEach(resultado => {
      if(resultado.status === "fulfilled"){
        certificados = certificados.concat(resultado.value);
      }
    });

    if(certificados.length === 0){
      mostrarError(
        "No se pudo cargar la base de certificados. Verifique que estén publicados certificados.json y certificados_ponentes.json en /repositorio-eventos/certificados/"
      );
    }
  }

  function mostrarError(mensaje){
    const resultado = document.getElementById("resultado");
    resultado.className = "resultado error";
    resultado.innerHTML = mensaje;
  }

  function etiquetaTipo(tipo){
    if(tipo === "Ponente"){
      return `
        <span style="
          display:inline-block;
          margin-bottom:10px;
          padding:6px 12px;
          border-radius:999px;
          background:#fff5df;
          color:#8a5a00;
          border:1px solid #e4be6b;
          font-family:Montserrat, sans-serif;
          font-weight:800;
          font-size:13px;
        ">
          Certificado de ponente
        </span>
      `;
    }

    return `
      <span style="
        display:inline-block;
        margin-bottom:10px;
        padding:6px 12px;
        border-radius:999px;
        background:#eaf6ef;
        color:#195d35;
        border:1px solid #bfe5ce;
        font-family:Montserrat, sans-serif;
        font-weight:800;
        font-size:13px;
      ">
        Certificado de asistente
      </span>
    `;
  }

  function mostrarOk(nombre, archivo, tipo){
    const resultado = document.getElementById("resultado");
    const rutaArchivo = normalizarRutaArchivo(archivo);

    resultado.className = "resultado ok";
    resultado.innerHTML = `
      <strong>Certificado encontrado</strong><br><br>
      ${etiquetaTipo(tipo)}
      <br>
      ${nombre}
      <br>
      <a href="${rutaArchivo}" download>
        Descargar certificado
      </a>
    `;
  }

  function mostrarMultiples(lista){
    const resultado = document.getElementById("resultado");
    resultado.className = "resultado ok";

    let html = `
      <strong>Encontramos varios certificados asociados a sus datos</strong><br>
      <span style="display:block; margin-top:6px;">
        Puede descargar cada certificado según corresponda.
      </span>
    `;

    lista.forEach(item => {
      const rutaArchivo = normalizarRutaArchivo(item.archivo);

      html += `
        <div style="
          margin-top:20px;
          padding-top:18px;
          border-top:1px solid rgba(20,63,125,0.15);
        ">
          ${etiquetaTipo(item.tipo_certificado)}
          <br>
          ${item.nombre}
          <br>
          <a href="${rutaArchivo}" download>
            Descargar certificado
          </a>
        </div>
      `;
    });

    resultado.innerHTML = html;
  }

  function normalizarRutaArchivo(archivo){
    if(!archivo){
      return "#";
    }

    archivo = String(archivo).trim();

    if(archivo.startsWith("http")){
      return archivo;
    }

    if(archivo.startsWith("/")){
      return archivo;
    }

    if(archivo.startsWith("repositorio-eventos/certificados/")){
      return "/" + archivo;
    }

    if(archivo.startsWith("certificados/")){
      return "/repositorio-eventos/certificados/" + archivo.replace("certificados/", "");
    }

    return "/repositorio-eventos/certificados/" + archivo;
  }

  document.getElementById("certForm").addEventListener("submit", async function(event){
    event.preventDefault();

    const valorOriginal = document.getElementById("identificador").value.trim();

    if(!valorOriginal){
      mostrarError("Ingrese su nombre completo, correo electrónico o celular.");
      return;
    }

    if(certificados.length === 0){
      mostrarError("La base de certificados todavía no está cargada. Recargue la página e intente nuevamente.");
      return;
    }

    const esCorreo = valorOriginal.includes("@");
    const soloNumeros = valorOriginal.replace(/\D/g, "");
    const esCelular = soloNumeros.length >= 7 && !esCorreo;

    let hashEntrada;

    if(esCorreo){
      hashEntrada = await sha256(normalizarEmail(valorOriginal));
    }else if(esCelular){
      hashEntrada = await sha256(normalizarCelular(valorOriginal));
    }else{
      hashEntrada = await sha256(normalizarNombre(valorOriginal));
    }

    const encontrados = certificados.filter(item => {
      const nombres = item.nombres_hash || [];
      const emails = item.emails_hash || [];
      const celulares = item.celulares_hash || [];

      return (
        nombres.includes(hashEntrada) ||
        emails.includes(hashEntrada) ||
        celulares.includes(hashEntrada)
      );
    });

    if(encontrados.length === 0){
      mostrarError("No encontramos un certificado asociado a ese nombre, correo o celular.");
      return;
    }

    if(encontrados.length === 1){
      const certificado = encontrados[0];

      mostrarOk(
        certificado.nombre,
        certificado.archivo,
        certificado.tipo_certificado
      );

      return;
    }

    mostrarMultiples(encontrados);
  });

  cargarCertificados();
</script>

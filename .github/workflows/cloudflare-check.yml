name: Verificar acceso a Cloudflare
on:
  workflow_dispatch:

permissions: {}

jobs:
  verificar:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    environment: cloudflare-poster
    steps:
      - name: Verificar token y acceso de lectura al Worker existente
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          python3 - <<'PY'
          import json, os, re, urllib.error, urllib.request
          token = os.environ.get('CLOUDFLARE_API_TOKEN', '').strip()
          account = os.environ.get('CLOUDFLARE_ACCOUNT_ID', '').strip()
          if not token:
              raise SystemExit('Falta el secreto CLOUDFLARE_API_TOKEN.')
          if not re.fullmatch(r'[0-9a-f]{32}', account):
              raise SystemExit('Falta una variable CLOUDFLARE_ACCOUNT_ID válida.')
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, *args, **kwargs):
                  return None
          client = urllib.request.build_opener(NoRedirect())
          base = f'https://api.cloudflare.com/client/v4/accounts/{account}'
          def check(path, label):
              request = urllib.request.Request(base + path, headers={
                  'Authorization': 'Bearer ' + token, 'Accept': 'application/json',
              })
              try:
                  with client.open(request, timeout=15) as response:
                      payload = json.load(response)
              except urllib.error.HTTPError as error:
                  raise SystemExit(f'{label}: Cloudflare respondió HTTP {error.code}.')
              except (urllib.error.URLError, ValueError, TimeoutError):
                  raise SystemExit(f'{label}: no se pudo confirmar la respuesta de Cloudflare.')
              if payload.get('success') is not True:
                  raise SystemExit(f'{label}: Cloudflare no confirmó el acceso.')
          check('/tokens/verify', 'Token de cuenta')
          check('/workers/scripts/dawn-base-5480/script-settings', 'Worker ACMI')
          print('Token aceptado y Worker accesible por lectura; no se hizo ningún cambio.')
          PY
